<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mimi Painting</title>
<style>
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:"Comic Sans MS","Chalkboard SE",system-ui,sans-serif;background:#fff9e6;overflow:hidden;
  padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px);height:100dvh}
.screen{display:none;flex-direction:column;height:100%;align-items:center}
.screen.on{display:flex}
button{font-family:inherit;font-weight:bold;border:none;cursor:pointer;color:#fff;background:#7bd3ff;border-radius:16px;font-size:18px;padding:10px 16px;white-space:nowrap}
button.active{background:#ffb347}
button:disabled{background:#ccc;cursor:not-allowed}

#welcome{justify-content:center;text-align:center;padding:20px}
#welcome h1{font-size:40px;color:#ff6b9d;margin:0 0 12px}
#welcome p{font-size:22px;color:#555;max-width:420px;margin:0 0 30px}
#welcome button{font-size:26px;padding:16px 36px}

#levels{padding:12px;min-height:0}
#levels h2{color:#ff6b9d;font-size:30px;margin:8px 0}
#grid{position:relative;width:100%;max-width:520px;flex:1;min-height:0;overflow-y:auto;border-radius:24px;background:linear-gradient(#b8ef94,#6cc24a);box-shadow:inset 0 0 0 6px #5aa83d}
.lv{position:absolute;width:52px;height:52px;margin:0;padding:0;border-radius:50%;border:4px solid #fff;box-shadow:0 4px 0 rgba(0,0,0,.2);font-size:18px;color:#fff;background:#4d96ff;display:flex;align-items:center;justify-content:center;transform:translate(-50%,-50%)}
.lv.cur{animation:pulse 1.2s infinite}
@keyframes pulse{50%{transform:translate(-50%,-50%) scale(1.15)}}
.lv.done{background:#ff9f1c}
.lv.locked{background:#ddd;color:#999}

#play{padding:8px;overflow-y:auto;position:relative}
#play>*{flex-shrink:0}
#play>#tools{margin-top:auto;padding-top:10px}
#topbar{display:flex;justify-content:space-between;align-items:center;width:100%;max-width:640px;gap:8px}
#topbar .title{font-size:18px;color:#ff6b9d;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:1}
#topbar #count{flex:0 0 auto}
#dotsBtn{background:#fff;color:#ff6b9d;font-size:26px;padding:4px 14px;box-shadow:0 2px 6px rgba(0,0,0,.15)}
#menu{display:none;position:absolute;right:12px;top:58px;background:#fff;border-radius:16px;padding:8px;box-shadow:0 6px 18px rgba(0,0,0,.2);flex-direction:column;gap:8px;z-index:5}
#menu.on{display:flex}
#hint{display:none;align-items:center;gap:10px;background:#fff;border-radius:14px;padding:6px 12px;margin-top:6px;font-size:18px;color:#333;box-shadow:0 2px 8px rgba(0,0,0,.1)}
#hint.on{display:flex}
#hintImg{width:60px;height:60px;flex:0 0 auto}
#board{position:relative;width:min(92vw,46vh,500px);aspect-ratio:1;margin:8px 0;background:#fff;border-radius:18px;box-shadow:0 4px 12px rgba(0,0,0,.12);overflow:hidden;flex:0 0 auto}
#paint,#outline{position:absolute;inset:0;width:100%;height:100%}
#paint{touch-action:none;cursor:crosshair}
#outline{pointer-events:none}

#panel{width:100%;max-width:640px;min-height:0}
.sub{display:none;flex-wrap:wrap;gap:8px;justify-content:center;align-items:center;background:#fff;border-radius:16px;padding:10px;margin:4px 0;box-shadow:0 2px 8px rgba(0,0,0,.12)}
.sub.on{display:flex}
#colors{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.swatch{width:38px;height:38px;border-radius:50%;border:3px solid #fff;box-shadow:0 2px 4px rgba(0,0,0,.25);cursor:pointer}
.swatch.active{border-color:#333;transform:scale(1.15)}
input[type=range]{width:110px}
#ctrl{display:none;flex-direction:column;align-items:center;gap:8px;width:100%;margin-top:8px}
.dpad{display:grid;grid-template-columns:repeat(3,46px);grid-template-rows:repeat(3,46px);gap:4px}
.dp{width:46px;height:46px;padding:0;font-size:18px;border-radius:50%;background:#7bd3ff;display:flex;align-items:center;justify-content:center}
.dp.pen{font-size:13px;background:#ff6b9d;border-radius:28px}
.dp.pen.on{background:#6bcb77}
#cursor{position:absolute;width:18px;height:18px;margin:-9px 0 0 -9px;border-radius:50%;border:2px solid #333;box-shadow:0 0 0 1px #fff;pointer-events:none;display:none;z-index:2;opacity:.6}

#tools{width:100%;max-width:640px;display:flex;gap:14px;justify-content:center;align-items:center;padding:6px 0;position:sticky;bottom:0;background:#fff9e6;z-index:4}
#play:has(#ctrl[style*="flex"]) #board{width:min(80vw,30vh,400px)}
.ic{width:64px;height:64px;border-radius:50%;padding:0;font-size:28px;background:#7bd3ff;display:flex;align-items:center;justify-content:center;box-shadow:0 3px 8px rgba(0,0,0,.15)}
.ic.on{background:#ffb347}
#next{background:#6bcb77;width:76px;height:76px;border-radius:50%;padding:0;font-size:32px;display:flex;align-items:center;justify-content:center;box-shadow:0 3px 8px rgba(0,0,0,.2)}

#toast{position:fixed;top:40%;left:50%;transform:translate(-50%,-50%);background:#fff;border:4px solid #ffb347;border-radius:24px;padding:20px 28px;font-size:26px;color:#ff6b9d;display:none;text-align:center;box-shadow:0 6px 20px rgba(0,0,0,.2)}
#preview{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:10}
#preview.on{display:flex}
#win{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;z-index:20}
#win.on{display:flex}
.ovl{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;z-index:20}
.ovl.on{display:flex}
.wbox{background:#fff;border-radius:24px;padding:24px;text-align:center;max-width:90vw;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.wbox h2{color:#ff6b9d;margin:0 0 8px;font-size:30px}
.wbox p{font-size:20px;color:#555;margin:0 0 16px}
.wbox button{margin:4px}
#topbar #title.boxed{background:#fff;border-radius:16px;padding:6px 12px;box-shadow:0 2px 8px rgba(0,0,0,.12)}
#preview .pbox{background:#fff;border-radius:20px;padding:16px;text-align:center;max-width:92vw}
#preview p{font-size:20px;color:#ff6b9d;margin:4px 0 10px}
#pimg{max-width:80vw;max-height:60vh;border-radius:12px;background:#fff;border:2px solid #eee}
</style>
</head>
<body>

<section id="welcome" class="screen on">
  <h1>🎨 Welcome to Mimi! 🌈</h1>
  <p>The kids' app where you can paint.</p>
  <button id="startBtn">Let's Paint! 🖌️</button>
</section>

<section id="levels" class="screen">
  <h2>Choose a Level</h2>
  <div id="grid"></div>
</section>

<section id="play" class="screen">
  <div id="topbar">
    <button id="backBtn">⬅️ Back</button>
    <div class="title" id="title">Level 1</div>
    <div class="title" id="count">1/10</div>
    <button id="dotsBtn" aria-label="Menu">⋮</button>
  </div>

  <div id="menu">
    <button id="musicBtn">🎵 Music On</button>
    <button id="saveBtn">💾 Save</button>
  </div>

  <div id="hint"><div id="hintImg"></div><div id="hintText"></div></div>

  <div id="board">
    <canvas id="paint" width="600" height="600"></canvas>
    <div id="cursor"></div>
    <svg id="outline" viewBox="0 0 200 200" preserveAspectRatio="xMidYMid meet" fill="none" stroke="#333" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"></svg>
  </div>

  <div id="panel">
    <div id="pColors" class="sub"><div id="colors"></div></div>
    <div id="pAction" class="sub">
      <button id="brushBtn" class="active">🖌️ Brush</button>
      <button id="eraserBtn">🧽 Eraser</button>
      <button id="fillBtn">🪣 Fill</button>
      <input type="range" id="size" min="3" max="40" value="10" aria-label="Brush size">
      <div id="ctrl"><div class="dpad"><span></span><button class="dp" data-dir="up" aria-label="Up">⬆️</button><span></span><button class="dp" data-dir="left" aria-label="Left">⬅️</button><button class="dp" id="penBtn" title="Fill">🪣</button><button class="dp" data-dir="right" aria-label="Right">➡️</button><span></span><button class="dp" data-dir="down" aria-label="Down">⬇️</button><span></span></div></div>
    </div>
    <div id="pFix" class="sub">
      <button id="undoBtn">↩️ Undo</button>
      <button id="clearBtn">🗑️ Clear</button>
    </div>
  </div>

  <div id="tools">
    <button class="ic" id="icColors" title="Colors" aria-label="Colors">🎨</button>
    <button class="ic" id="icAction" title="Brush and eraser" aria-label="Brush and eraser">✏️</button>
    <button class="ic" id="icFix" title="Undo and clear" aria-label="Undo and clear">🔧</button>
    <button class="ic" id="icGame" title="Controller" aria-label="Controller" style="display:none">🎮</button>
    <button id="next" title="Next" aria-label="Next">⏩</button>
    <button id="checkBtn" class="ic" title="Done" aria-label="Done" style="display:none;background:#6bcb77;width:76px;height:76px">✅</button>
  </div>
</section>

<div id="preview"><div class="pbox"><p id="pmsg"></p><img id="pimg" alt="Your painting"><br><button id="closePreview">Close ✖️</button></div></div>
<div id="win"><div class="wbox"><h2 id="winTitle"></h2><p id="winText"></p><button id="winNext">Next ➡️</button><button id="winMap">Map 🗺️</button></div></div>
<div id="okBox" class="ovl"><div class="wbox"><h2>Use the controller 🎮</h2><p>Use the arrows to move and paint. Tap the bucket in the middle to fill.</p><button id="okBtn">OK ✅</button></div></div>
<div id="toast"></div>

// Level n uses theme (n-1) % 10; the order of its pictures changes every 10 levels
function levelTheme(n) { return THEMES[(n - 1) % THEMES.length]; }
function levelItems(n) {
  const items = levelTheme(n).items;
  const shift = Math.floor((n - 1) / THEMES.length) % items.length;
  return items.slice(shift).concat(items.slice(0, shift));
}

  try { return Math.min(100, Math.max(1, parseInt(localStorage.getItem('mimiUnlocked')) || 1)); }

function saveUnlocked(v) {
  try { localStorage.setItem('mimiUnlocked', String(v)); } catch (e) {}
}

// Winding path map of 100 levels
function buildMap() {
  const grid = document.getElementById('grid');
  const H = 8000;
  const NS = 'http://www.w3.org/2000/svg';
  const pts = [];
  for (let n = 1; n <= 100; n++) pts.push([50 + 30 * Math.sin(n * 0.75), 80 + (n - 1) * 78]);
  grid.innerHTML = '';
  const inner = document.createElement('div');
  inner.style.cssText = 'position:relative;width:100%;height:' + H + 'px';

  const svg = document.createElementNS(NS, 'svg');
  svg.setAttribute('viewBox', '0 0 100 ' + H);
  svg.setAttribute('preserveAspectRatio', 'none');
  svg.style.cssText = 'position:absolute;inset:0;width:100%;height:100%';
  const d = pts.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(2) + ' ' + p[1].toFixed(2)).join(' ');
  [['#b07a3e', 40], ['#e2b57a', 28]].forEach(([stroke, w]) => {
    const path = document.createElementNS(NS, 'path');
    path.setAttribute('d', d);
    path.setAttribute('fill', 'none');
    path.setAttribute('stroke', stroke);
    path.setAttribute('stroke-width', w);
    path.setAttribute('stroke-linecap', 'round');
    path.setAttribute('stroke-linejoin', 'round');
    path.setAttribute('vector-effect', 'non-scaling-stroke');
    svg.appendChild(path);
  });
  inner.appendChild(svg);

  // Decorations on the grass
  const DECOR = ['🌳','🌷','🌻','🍄','🌸','🏡','⛰️','🌊','🦋','🐞'];
  for (let k = 0; k < 14; k++) {
    const e = document.createElement('div');
    e.textContent = DECOR[k % DECOR.length];
    e.style.cssText = 'position:absolute;font-size:30px;transform:translate(-50%,-50%);top:' + (120 + k * 540) + 'px;left:' + (k % 2 ? 10 : 90) + '%';
    inner.appendChild(e);
  }

  // Level stops
  pts.forEach((p, i) => {
    const n = i + 1;
    const b = document.createElement('button');
    b.className = 'lv' + (n > unlocked ? ' locked' : '') + (completed.has(n) ? ' done' : '') + (n === unlocked ? ' cur' : '');
    b.textContent = n > unlocked ? '🔒' : n;
    b.title = levelTheme(n).name;
    b.disabled = n > unlocked;
    b.style.left = p[0] + '%';
    b.style.top = p[1] + 'px';
    b.onclick = () => startLevel(n);
    inner.appendChild(b);
  });
  grid.appendChild(inner);
  setTimeout(() => {
    grid.scrollTop = Math.max(0, pts[Math.min(unlocked, 100) - 1][1] - grid.clientHeight / 2);
  }, 0);
}

function buildLevels() {
  buildMap();
}
function buildLevelsOld() {
  const grid = document.getElementById('grid');
  grid.innerHTML = '';
  for (let n = 1; n <= 100; n++) {
    const b = document.createElement('button');
    b.className = 'lv' + (n > unlocked ? ' locked' : '') + (completed.has(n) ? ' done' : '');
    b.textContent = n > unlocked ? '🔒' : n;
    b.title = levelTheme(n).name;
    b.disabled = n > unlocked;
    b.onclick = () => startLevel(n);
    grid.appendChild(b);
  }
}

function saveState() {
  history.push(pctx.getImageData(0, 0, paint.width, paint.height));
  if (history.length > 20) history.shift();
}
function undo() {
  if (!history.length) return;
  pctx.putImageData(history.pop(), 0, 0);
}

function toCanvas(e) {
  const r = paint.getBoundingClientRect();
  return {
    x: (e.clientX - r.left) * paint.width / r.width,
    y: (e.clientY - r.top) * paint.height / r.height
  };
}
function brushWidth() { return (mode === 'eraser' ? size * 2 : size) * 3; }
function applyBrush() {
  pctx.globalCompositeOperation = mode === 'eraser' ? 'destination-out' : 'source-over';
  pctx.strokeStyle = color;
  pctx.fillStyle = color;
  pctx.lineWidth = brushWidth();
  pctx.lineCap = 'round';
  pctx.lineJoin = 'round';
}

paint.addEventListener('pointerdown', e => {
  if (level >= 50) { e.preventDefault(); return; }
  if (mode === 'fill') {
    e.preventDefault();
    closeMenu();
    const fp = toCanvas(e);
    fillAt(fp.x, fp.y);
    return;
  }
  e.preventDefault();
  closeMenu();
  saveState();
  drawing = true;
  last = toCanvas(e);
  paint.setPointerCapture(e.pointerId);
  applyBrush();
  pctx.beginPath();
  pctx.arc(last.x, last.y, brushWidth() / 2, 0, Math.PI * 2);
  pctx.fill();
});
paint.addEventListener('pointermove', e => {
  if (!drawing) return;
  const p = toCanvas(e);
  applyBrush();
  pctx.beginPath();
  pctx.moveTo(last.x, last.y);
  pctx.lineTo(p.x, p.y);
  pctx.stroke();
  last = p;
});
const stopDrawing = () => { drawing = false; last = null; pctx.globalCompositeOperation = 'source-over'; checkComplete(); };
paint.addEventListener('pointerup', stopDrawing);
paint.addEventListener('pointercancel', stopDrawing);

// ---------- Level 50+: controller and automatic finish ----------
let cur = { x: 300, y: 300 }, penDown = false, moveTimer = null, finishing = false;
const DIRS = { up: [0, -8], down: [0, 8], left: [-8, 0], right: [8, 0] };

function placeCursor() {
  const c = document.getElementById('cursor');
  c.style.left = (cur.x / 6) + '%';
  c.style.top = (cur.y / 6) + '%';
  const sz = Math.max(8, brushWidth() * document.getElementById('board').clientWidth / 600);
  c.style.width = sz + 'px';
  c.style.height = sz + 'px';
  c.style.margin = (-sz / 2) + 'px 0 0 ' + (-sz / 2) + 'px';
  c.style.background = mode === 'eraser' ? '#fff' : color;
}

function step(dx, dy) {
  const prev = { x: cur.x, y: cur.y };
  cur.x = Math.max(0, Math.min(600, cur.x + dx));
  cur.y = Math.max(0, Math.min(600, cur.y + dy));
  if (penDown) {
    applyBrush();
    pctx.beginPath();
    pctx.moveTo(prev.x, prev.y);
    pctx.lineTo(cur.x, cur.y);
    pctx.stroke();
    pctx.globalCompositeOperation = 'source-over';
  }
  placeCursor();
}

document.querySelectorAll('.dp[data-dir]').forEach(btn => {
  const d = DIRS[btn.dataset.dir];
  const stop = () => { clearInterval(moveTimer); moveTimer = null; };
  btn.addEventListener('pointerdown', e => {
    e.preventDefault();
    stop();
    step(d[0], d[1]);
    moveTimer = setInterval(() => step(d[0], d[1]), 35);
  });
  btn.addEventListener('pointerup', stop);
  btn.addEventListener('pointerleave', stop);
  btn.addEventListener('pointercancel', stop);
});

    pctx.beginPath();
    pctx.arc(cur.x, cur.y, brushWidth() / 2, 0, Math.PI * 2);
    pctx.fill();
    pctx.globalCompositeOperation = 'source-over';

};

function hexToRgb(h) {
  const n = parseInt(h.slice(1), 16);
  return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
}

// Draws the example's shape as a white mask so we can compare paint against it
function renderMask(item) {
  return new Promise(res => {
    const svg = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200"><g fill="#fff" stroke="#fff" stroke-width="12" stroke-linejoin="round" stroke-linecap="round">' + item[3] + '</g></svg>';
    const img = new Image();
    img.onload = () => res(img);
    img.onerror = () => res(null);
    img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
  });
}

// True when most of the picture is painted in the color shown at the top
async function paintMatches() {
  const first = pictures[0];
  if (first && first[4]) return paintMatchesHard(first);
  return paintMatchesSingle();
}

async function paintMatchesSingle() {
  const item = pictures[0];
  if (!item) return false;
  const N = 150;
  const [R, G, B] = hexToRgb(item[2]);
  const near = (p, i) => p[i + 3] > 128 && Math.abs(p[i] - R) + Math.abs(p[i + 1] - G) + Math.abs(p[i + 2] - B) < 110;
  const pc = document.createElement('canvas');
  pc.width = N; pc.height = N;
  const pcx = pc.getContext('2d');
  pcx.drawImage(paint, 0, 0, N, N);
  const svg = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200"><g fill="#fff" stroke="#fff" stroke-width="6" stroke-linejoin="round" stroke-linecap="round">' + item[3] + '</g></svg>';
  const img = await new Promise(res => {
    const im = new Image();
    im.onload = () => res(im);
    im.onerror = () => res(null);
    im.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
  });
  try {
    if (!img) throw new Error('no mask');
    const mc = document.createElement('canvas');
    mc.width = N; mc.height = N;
    const mcx = mc.getContext('2d');
    mcx.drawImage(img, 0, 0, N, N);
    const m = mcx.getImageData(0, 0, N, N).data;
    const p = pcx.getImageData(0, 0, N, N).data;
    let total = 0, good = 0;
    for (let i = 0; i < m.length; i += 4) {
      if (m[i + 3] < 128) continue;
      total++;
      if (near(p, i)) good++;
    }
    return total > 0 && good / total >= 0.5;
  } catch (e) {
    const p = pcx.getImageData(0, 0, N, N).data;
    let good = 0;
    for (let i = 0; i < p.length; i += 4) if (near(p, i)) good++;
    return good / (N * N) >= 0.15;
  }
}

// Bucket fill: fills the area around the tapped point, stopping at the outline
async function fillAtExact(x, y) {
  const item = pictures[pictureIndex];
  if (!item) return;
  const W = 600;
  const img = await renderOutlineImg(item);
  const wc = document.createElement('canvas');
  wc.width = W; wc.height = W;
  const wx = wc.getContext('2d');
  wx.fillStyle = '#fff';
  wx.fillRect(0, 0, W, W);
  if (img) wx.drawImage(img, 0, 0, W, W);
  let wd;
  try {
    wd = wx.getImageData(0, 0, W, W).data;
  } catch (e) {
    toast('Try the brush this time 🖌️', 1200);
    return;
  }
  const blocked = i => (wd[i * 4] + wd[i * 4 + 1] + wd[i * 4 + 2]) / 3 < 160;
  const start = Math.round(y) * W + Math.round(x);
  const seed = blocked(start) ? nearestOpen(start, W, blocked) : start;
  if (seed < 0) { toast('Tap inside the picture 🪣', 1200); return; }
  const seen = new Uint8Array(W * W);
  const stack = [seed];
  const region = [];
  let leak = false;
  seen[seed] = 1;
  while (stack.length) {
    const i = stack.pop();
    region.push(i);
    const px = i % W, py = (i - px) / W;
    if (px === 0 || py === 0 || px === W - 1 || py === W - 1) leak = true;
    const nb = [];
    if (px > 0) nb.push(i - 1);
    if (px < W - 1) nb.push(i + 1);
    if (py > 0) nb.push(i - W);
    if (py < W - 1) nb.push(i + W);
    for (const n of nb) {
      if (!seen[n] && !blocked(n)) { seen[n] = 1; stack.push(n); }
    }
  }
  if (leak || region.length > W * W * 0.8) { toast('Paint the gap shut first 🖌️', 1400); return; }
  saveState();
  const [R, G, B] = hexToRgb(mode === 'eraser' ? '#ffffff' : color);
  const out = pctx.getImageData(0, 0, W, W);
  const od = out.data;
  for (const i of region) { od[i * 4] = R; od[i * 4 + 1] = G; od[i * 4 + 2] = B; od[i * 4 + 3] = 255; }
  pctx.putImageData(out, 0, 0);
  checkComplete();
}

// Counts only the inside of a part, not the black outline edges (the fill tool cannot paint under those)
function erodedCoverage(m, pd, R, G, B, N) {
  const E = 3;
  const inMask = (x, y) => x >= 0 && y >= 0 && x < N && y < N && m[(y * N + x) * 4 + 3] >= 128;
  const near = i => pd[i + 3] > 128 && Math.abs(pd[i] - R) + Math.abs(pd[i + 1] - G) + Math.abs(pd[i + 2] - B) < 110;
  let total = 0, good = 0, allTotal = 0, allGood = 0;
  for (let y = 0; y < N; y++) {
    for (let x = 0; x < N; x++) {
      if (!inMask(x, y)) continue;
      const i = (y * N + x) * 4;
      allTotal++;
      if (near(i)) allGood++;
      let edge = false;
      for (let dy = -E; dy <= E && !edge; dy++) {
        for (let dx = -E; dx <= E && !edge; dx++) {
          if (!inMask(x + dx, y + dy)) edge = true;
        }
      }
      if (edge) continue;
      total++;
      if (near(i)) good++;
    }
  }
  if (total === 0) return allTotal ? allGood / allTotal : 0;
  return good / total;
}

  pcx.drawImage(paint, 0, 0, N, N);

    const img = await renderPartMask(part[3]);

      }

      for (let i = 0; i < pd.length; i += 4) if (near(i)) good++;

// ---------- Controller: bucket in the middle, arrows paint, no finger painting ----------
// Looks for the nearest spot inside the picture when the tap lands right on an outline
function nearestOpen(start, W, blocked) {
  const sx = start % W, sy = (start - sx) / W;
  for (let r = 1; r <= 14; r++) {
    for (let dy = -r; dy <= r; dy++) {
      for (let dx = -r; dx <= r; dx++) {
        if (Math.max(Math.abs(dx), Math.abs(dy)) !== r) continue;
        const x = sx + dx, y = sy + dy;
        if (x < 0 || y < 0 || x >= W || y >= W) continue;
        const i = y * W + x;
        if (!blocked(i)) return i;
      }
    }
  }
  return -1;
}

const MELODY = [523,587,659,784,659,587,523,659,784,880,784,659,587,523,494,523];

function getAudio() {
  if (!audioCtx) {
    try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return null; }
  }
  if (audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}
function tone(freq, dur, vol, type) {
  const a = getAudio();
  if (!a) return;
  const o = a.createOscillator(), g = a.createGain();
  const t = a.currentTime;
  o.type = type; o.frequency.value = freq;
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(vol, t + 0.02);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(a.destination);
  o.start(t); o.stop(t + dur + 0.05);
}
function startMusic() {
  if (!musicOn || musicTimer) return;
  musicTimer = setInterval(() => {
    tone(MELODY[noteIdx % MELODY.length], 0.6, 0.05, 'triangle');
    noteIdx++;
  }, 450);
}

  img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
}

function showSaved(url) {
  const msg = document.getElementById('pmsg');
  const pimg = document.getElementById('pimg');
  if (!url) {
    pimg.removeAttribute('src');
    msg.textContent = 'Sorry, I could not save this picture. Try again!';
  } else {
    pimg.src = url;
    msg.textContent = 'Your painting is ready! 🎉 Press and hold the picture to save it.';
    try {
      const a = document.createElement('a');
      a.href = url;
      a.download = 'mimi-level-' + level + '-picture-' + (pictureIndex + 1) + '.png';
      document.body.appendChild(a);
      a.click();
      a.remove();
    } catch (e) {}
  }
  document.getElementById('preview').classList.add('on');
}
document.getElementById('saveBtn').onclick = savePicture;
document.getElementById('closePreview').onclick = () => document.getElementById('preview').classList.remove('on');

// ---------- Toast ----------
function toast(msg, ms) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.style.display = 'block';
  return new Promise(res => setTimeout(() => { t.style.display = 'none'; res(); }, ms));
}

// ---------- Next / finish ----------
document.getElementById('next').onclick = async () => {
  closeMenu();
  if (pictureIndex < pictures.length - 1) {
    pictureIndex++;
    showPicture();
    return;
  }
  completed.add(level);
  if (level === unlocked && unlocked < 100) {
    unlocked = level + 1;
    saveUnlocked(unlocked);
  }
  playCelebration();
  await toast('🎉 Level ' + level + ' complete! 🎉', 1800);
  buildLevels();
  show('levels');
};
</script>
</body>
