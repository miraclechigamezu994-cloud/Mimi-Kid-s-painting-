<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mimi Painting</title>
<style>
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:"Comic Sans MS","Chalkboard SE",system-ui,sans-serif;background:#fff9e6;overflow:hidden;
  padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px);height:100dvh}
.screen{display:none;flex-direction:column;height:100%;align-items:center}
.screen.on{display:flex}
button{font-family:inherit;font-weight:bold;border:none;cursor:pointer;color:#fff;background:#7bd3ff;border-radius:16px;font-size:18px;padding:10px 16px}
button.active{background:#ffb347}
button:disabled{background:#ccc;cursor:not-allowed}

/* Welcome */
#welcome{justify-content:center;text-align:center;padding:20px}
#welcome h1{font-size:40px;color:#ff6b9d;margin:0 0 12px}
#welcome p{font-size:22px;color:#555;max-width:420px;margin:0 0 30px}
#welcome button{font-size:26px;padding:16px 36px}

/* Level select */
#levels{padding:12px;min-height:0}
#levels h2{color:#ff6b9d;font-size:30px;margin:8px 0}
#grid{display:grid;grid-template-columns:repeat(10,1fr);gap:6px;width:100%;max-width:560px;overflow:auto;padding:4px;flex:1;min-height:0;align-content:start}
.lv{aspect-ratio:1;padding:0;font-size:18px;background:#7bd3ff;border-radius:12px;color:#fff}
.lv.done{background:#6bcb77}
.lv.locked{background:#ddd;color:#999}

/* Play */
#play{padding:8px}
#topbar{display:flex;justify-content:space-between;align-items:center;width:100%;max-width:640px;gap:8px}
#topbar .title{font-size:22px;color:#ff6b9d;text-align:center}
#board{position:relative;width:min(92vw,56vh,520px);aspect-ratio:1;margin:8px 0;background:#fff;border-radius:18px;box-shadow:0 4px 12px rgba(0,0,0,.12);overflow:hidden;flex:0 0 auto}
#paint,#outline{position:absolute;inset:0;width:100%;height:100%}
#paint{touch-action:none;cursor:crosshair}
#outline{pointer-events:none}
#tools{width:100%;max-width:640px;display:flex;flex-direction:column;gap:8px;align-items:center}
#colors{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.swatch{width:38px;height:38px;border-radius:50%;border:3px solid #fff;box-shadow:0 2px 4px rgba(0,0,0,.25);cursor:pointer}
.swatch.active{border-color:#333;transform:scale(1.15)}
#row{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:center}
input[type=range]{width:100px}
#next{background:#6bcb77;font-size:22px;padding:12px 26px}
#toast{position:fixed;top:40%;left:50%;transform:translate(-50%,-50%);background:#fff;border:4px solid #ffb347;border-radius:24px;padding:20px 28px;font-size:26px;color:#ff6b9d;display:none;text-align:center;box-shadow:0 6px 20px rgba(0,0,0,.2)}
#row button{white-space:nowrap}
#preview{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:10}
#preview.on{display:flex}
#preview .pbox{background:#fff;border-radius:20px;padding:16px;text-align:center;max-width:92vw}
#preview p{font-size:20px;color:#ff6b9d;margin:4px 0 10px}
#pimg{max-width:80vw;max-height:60vh;border-radius:12px;background:#fff;border:2px solid #eee}
</style>
</head>
<body>

<!-- Welcome -->
<section id="welcome" class="screen on">
  <h1>🎨 Welcome to Mimi! 🌈</h1>
  <p>The kids' app where you can paint.</p>
  <button id="startBtn">Let's Paint! 🖌️</button>
</section>

<!-- Level select -->
<section id="levels" class="screen">
  <h2>Choose a Level</h2>
  <div id="grid"></div>
</section>

<!-- Painting -->
<section id="play" class="screen">
  <div id="topbar">
    <button id="backBtn">⬅️ Back</button>
    <div class="title" id="title">Level 1</div>
    <div class="title" id="count">1/10</div>
  </div>

  <div id="board">
    <canvas id="paint" width="600" height="600"></canvas>
    <svg id="outline" viewBox="0 0 200 200" preserveAspectRatio="xMidYMid meet" fill="none" stroke="#333" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"></svg>
  </div>

  <div id="tools">
    <div id="colors"></div>
    <div id="row">
      <button id="brushBtn" class="active">🖌️ Brush</button>
      <button id="eraserBtn">🧽 Eraser</button>
      <input type="range" id="size" min="3" max="40" value="10" aria-label="Brush size">
      <button id="undoBtn">↩️ Undo</button>
      <button id="clearBtn">🗑️ Clear</button>
      <button id="saveBtn">💾 Save</button>
      <button id="musicBtn">🎵 Music On</button>
    </div>
    <button id="next">Next ➡️</button>
  </div>
</section>

<div id="preview"><div class="pbox"><p id="pmsg"></p><img id="pimg" alt="Your painting"><br><button id="closePreview">Close ✖️</button></div></div>
<div id="toast"></div>

<script>
// ---------- Pictures (outline drawings, 200x200 each) ----------
const SHAPES = {
  house:'<rect x="50" y="90" width="100" height="80"/><polygon points="40,95 100,40 160,95"/><rect x="88" y="120" width="24" height="50"/><rect x="60" y="105" width="20" height="20"/><rect x="120" y="105" width="20" height="20"/>',
  car:'<path d="M30 130 L50 100 L130 100 L155 130 L170 135 L170 158 L30 158 Z"/><circle cx="60" cy="158" r="14"/><circle cx="140" cy="158" r="14"/><path d="M62 100 L72 80 L115 80 L125 100"/>',
  cat:'<circle cx="100" cy="95" r="40"/><polygon points="68,75 72,38 96,65"/><polygon points="132,75 128,38 104,65"/><ellipse cx="100" cy="158" rx="35" ry="28"/><circle cx="86" cy="90" r="4"/><circle cx="114" cy="90" r="4"/>',
  dog:'<ellipse cx="100" cy="100" rx="45" ry="38"/><ellipse cx="58" cy="95" rx="14" ry="30"/><ellipse cx="142" cy="95" rx="14" ry="30"/><circle cx="85" cy="95" r="5"/><circle cx="115" cy="95" r="5"/><ellipse cx="100" cy="115" rx="10" ry="7"/><path d="M80 135 L80 185 M120 135 L120 185"/>',
  fish:'<ellipse cx="95" cy="100" rx="55" ry="32"/><polygon points="148,100 188,70 188,130"/><circle cx="68" cy="92" r="6"/>',
  tree:'<rect x="88" y="120" width="24" height="60"/><circle cx="100" cy="85" r="45"/>',
  flower:'<circle cx="100" cy="100" r="20"/><circle cx="100" cy="62" r="20"/><circle cx="136" cy="100" r="20"/><circle cx="100" cy="138" r="20"/><circle cx="64" cy="100" r="20"/><path d="M100 138 L100 190"/>',
  sun:'<circle cx="100" cy="100" r="35"/><path d="M100 30 L100 50 M100 150 L100 170 M30 100 L50 100 M150 100 L170 100 M49 49 L63 63 M137 137 L151 151 M151 49 L137 63 M63 137 L49 151"/>',
  boat:'<path d="M30 120 L170 120 L150 160 L50 160 Z"/><path d="M100 120 L100 40 L150 110"/>',
  apple:'<path d="M100 70 C60 50 30 80 40 120 C50 160 85 170 100 160 C115 170 150 160 160 120 C170 80 140 50 100 70 Z"/><path d="M100 70 Q105 45 125 40"/>',
  butterfly:'<ellipse cx="65" cy="90" rx="35" ry="30"/><ellipse cx="135" cy="90" rx="35" ry="30"/><ellipse cx="65" cy="135" rx="25" ry="20"/><ellipse cx="135" cy="135" rx="25" ry="20"/><line x1="100" y1="70" x2="100" y2="150"/>',
  bird:'<ellipse cx="100" cy="110" rx="50" ry="35"/><circle cx="60" cy="80" r="22"/><polygon points="38,80 20,85 38,92"/><path d="M90 110 Q110 80 130 110"/>',
  cloud:'<path d="M50 140 Q20 140 30 110 Q40 85 70 95 Q80 60 115 75 Q140 55 160 85 Q185 90 175 120 Q170 140 145 140 Z"/>',
  star:'<polygon points="100,20 120,75 180,75 132,110 150,170 100,135 50,170 68,110 20,75 80,75"/>',
  ball:'<circle cx="100" cy="100" r="70"/><path d="M30 100 L170 100 M100 30 Q130 100 100 170 M100 30 Q70 100 100 170"/>',
  duck:'<ellipse cx="100" cy="120" rx="60" ry="30"/><circle cx="135" cy="85" r="25"/><polygon points="155,85 185,92 155,98"/>'
};
const KEYS = Object.keys(SHAPES); // 16 pictures

// Each level shows 10 pictures; the starting point moves each level so they vary.
function levelPictures(n) {
  const start = ((n - 1) * 3) % KEYS.length;
  return Array.from({ length: 10 }, (_, i) => KEYS[(start + i) % KEYS.length]);
}

// ---------- Progress (highest unlocked level) ----------
function loadUnlocked() {
  try { return Math.min(100, Math.max(1, parseInt(localStorage.getItem('mimiUnlocked')) || 1)); }
  catch (e) { return 1; }
}
function saveUnlocked(v) {
  try { localStorage.setItem('mimiUnlocked', String(v)); } catch (e) {}
}
let unlocked = loadUnlocked();
let completed = new Set();
for (let i = 1; i < unlocked; i++) completed.add(i);

// ---------- Screens ----------
function show(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.toggle('on', s.id === id));
}

document.getElementById('startBtn').onclick = () => { buildLevels(); show('levels'); startMusic(); };

function buildLevels() {
  const grid = document.getElementById('grid');
  grid.innerHTML = '';
  for (let n = 1; n <= 100; n++) {
    const b = document.createElement('button');
    b.className = 'lv' + (n > unlocked ? ' locked' : '') + (completed.has(n) ? ' done' : '');
    b.textContent = n > unlocked ? '🔒' : n;
    b.disabled = n > unlocked;
    b.onclick = () => startLevel(n);
    grid.appendChild(b);
  }
}

// ---------- Painting ----------
const paint = document.getElementById('paint');
const pctx = paint.getContext('2d');
const outline = document.getElementById('outline');
const COLORS = ['#ff6b9d','#ff4d4d','#ff9f1c','#ffe066','#6bcb77','#2ec4b6','#4d96ff','#9b5de5','#8d5524','#000000'];

let level = 1, pictureIndex = 0, pictures = [];
let color = COLORS[0], size = 10, mode = 'brush';
let drawing = false, last = null, history = [];

const colorBox = document.getElementById('colors');
COLORS.forEach((c, i) => {
  const s = document.createElement('div');
  s.className = 'swatch' + (i === 0 ? ' active' : '');
  s.style.background = c;
  s.onclick = () => {
    color = c; setMode('brush');
    document.querySelectorAll('.swatch').forEach(x => x.classList.remove('active'));
    s.classList.add('active');
  };
  colorBox.appendChild(s);
});

function setMode(m) {
  mode = m;
  document.getElementById('brushBtn').classList.toggle('active', m === 'brush');
  document.getElementById('eraserBtn').classList.toggle('active', m === 'eraser');
}
document.getElementById('brushBtn').onclick = () => setMode('brush');
document.getElementById('eraserBtn').onclick = () => setMode('eraser');
document.getElementById('size').oninput = e => size = +e.target.value;

function clearPaint() {
  pctx.clearRect(0, 0, paint.width, paint.height);
  history = [];
}

function showPicture() {
  outline.innerHTML = SHAPES[pictures[pictureIndex]];
  clearPaint();
  document.getElementById('count').textContent = (pictureIndex + 1) + '/10';
  document.getElementById('next').textContent = pictureIndex === 9 ? 'Finish 🏆' : 'Next ➡️';
}

function startLevel(n) {
  level = n;
  pictures = levelPictures(n);
  pictureIndex = 0;
  document.getElementById('title').textContent = 'Level ' + n;
  show('play');
  showPicture();
}

document.getElementById('backBtn').onclick = () => { buildLevels(); show('levels'); };
document.getElementById('clearBtn').onclick = () => { saveState(); clearPaint(); };
document.getElementById('undoBtn').onclick = undo;

function saveState() {
  history.push(pctx.getImageData(0, 0, paint.width, paint.height));
  if (history.length > 20) history.shift();
}
function undo() {
  if (!history.length) return;
  pctx.putImageData(history.pop(), 0, 0);
}

function toCanvas(e) {
  const r = paint.getBoundingClientRect();
  return {
    x: (e.clientX - r.left) * paint.width / r.width,
    y: (e.clientY - r.top) * paint.height / r.height
  };
}
function brushWidth() { return (mode === 'eraser' ? size * 2 : size) * 3; }
function applyBrush() {
  pctx.globalCompositeOperation = mode === 'eraser' ? 'destination-out' : 'source-over';
  pctx.strokeStyle = color;
  pctx.fillStyle = color;
  pctx.lineWidth = brushWidth();
  pctx.lineCap = 'round';
  pctx.lineJoin = 'round';
}

paint.addEventListener('pointerdown', e => {
  e.preventDefault();
  saveState();
  drawing = true;
  last = toCanvas(e);
  paint.setPointerCapture(e.pointerId);
  applyBrush();
  pctx.beginPath();
  pctx.arc(last.x, last.y, brushWidth() / 2, 0, Math.PI * 2);
  pctx.fill();
});
paint.addEventListener('pointermove', e => {
  if (!drawing) return;
  const p = toCanvas(e);
  applyBrush();
  pctx.beginPath();
  pctx.moveTo(last.x, last.y);
  pctx.lineTo(p.x, p.y);
  pctx.stroke();
  last = p;
});
const stopDrawing = () => { drawing = false; last = null; pctx.globalCompositeOperation = 'source-over'; };
paint.addEventListener('pointerup', stopDrawing);
paint.addEventListener('pointercancel', stopDrawing);

// ---------- Sounds ----------
const MELODY = [523,587,659,784,659,587,523,659,784,880,784,659,587,523,494,523];
let audioCtx = null, musicOn = true, musicTimer = null, noteIdx = 0;

function getAudio() {
  if (!audioCtx) {
    try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return null; }
  }
  if (audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}

function tone(freq, dur, vol, type) {
  const a = getAudio();
  if (!a) return;
  const o = a.createOscillator(), g = a.createGain();
  const t = a.currentTime;
  o.type = type; o.frequency.value = freq;
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(vol, t + 0.02);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(a.destination);
  o.start(t); o.stop(t + dur + 0.05);
}

function startMusic() {
  if (!musicOn || musicTimer) return;
  musicTimer = setInterval(() => {
    tone(MELODY[noteIdx % MELODY.length], 0.6, 0.05, 'triangle');
    noteIdx++;
  }, 450);
}
function stopMusic() { clearInterval(musicTimer); musicTimer = null; }

document.getElementById('musicBtn').onclick = e => {
  musicOn = !musicOn;
  e.currentTarget.textContent = musicOn ? '🎵 Music On' : '🔇 Music Off';
  if (musicOn) startMusic(); else stopMusic();
};

function playCelebration() {
  if ('speechSynthesis' in window) {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance('Yayyyyy!');
    u.pitch = 1.8;
    u.rate = 0.9;
    u.volume = 1;
    speechSynthesis.speak(u);
    return;
  }
  // Fallback tune if voice is not available on this device
  const notes = [523, 659, 784, 1047, 784, 1047, 1319, 1568];
  notes.forEach((f, i) => setTimeout(() => tone(f, 0.35, 0.15, 'triangle'), i * 120));
}

// ---------- Save picture ----------
function savePicture() {
  const off = document.createElement('canvas');
  off.width = 600; off.height = 600;
  const o = off.getContext('2d');
  o.fillStyle = '#fff';
  o.fillRect(0, 0, 600, 600);
  o.drawImage(paint, 0, 0);
  const svg = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="600" height="600" fill="none" stroke="#333" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">' + outline.innerHTML + '</svg>';
  const finish = () => {
    let url = null;
    try { url = off.toDataURL('image/png'); } catch (e) { url = null; }
    showSaved(url);
  };
  const img = new Image();
  img.onload = () => { o.drawImage(img, 0, 0, 600, 600); finish(); };
  img.onerror = finish;
  img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
}

function showSaved(url) {
  const msg = document.getElementById('pmsg');
  const pimg = document.getElementById('pimg');
  if (!url) {
    pimg.removeAttribute('src');
    msg.textContent = 'Sorry, I could not save this picture. Try again!';
  } else {
    pimg.src = url;
    msg.textContent = 'Your painting is ready! 🎉 Press and hold the picture to save it.';
    try {
      const a = document.createElement('a');
      a.href = url;
      a.download = 'mimi-level-' + level + '-picture-' + (pictureIndex + 1) + '.png';
      document.body.appendChild(a);
      a.click();
      a.remove();
    } catch (e) {}
  }
  document.getElementById('preview').classList.add('on');
}

document.getElementById('saveBtn').onclick = savePicture;
document.getElementById('closePreview').onclick = () => document.getElementById('preview').classList.remove('on');

// ---------- Next / finish ----------
function toast(msg, ms) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.style.display = 'block';
  return new Promise(res => setTimeout(() => { t.style.display = 'none'; res(); }, ms));
}

document.getElementById('next').onclick = async () => {
  if (pictureIndex < 9) {
    pictureIndex++;
    showPicture();
    return;
  }
  completed.add(level);
  if (level === unlocked && unlocked < 100) {
    unlocked = level + 1;
    saveUnlocked(unlocked);
  }
  playCelebration();
  await toast('🎉 Level ' + level + ' complete! 🎉', 1800);
  buildLevels();
  show('levels');
};
</script>
</body>
</html>
